# Public fork — runs on GitHub-hosted ubuntu-latest because the
# nonagenticai org self-hosted runner groups have allows_public_repositories=false
# (correct security posture), so jobs from forks queue forever on self-hosted labels.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Install security tools
        run: uv pip install bandit pip-audit

      - name: Bandit security scan
        # The previously-tolerated B615 huggingface_unsafe_download was
        # patched in our fork (commit faf5f30). Tightened from `-lll -iii`
        # to `-ll -ii` so any newly introduced Medium+ finding fails CI.
        run: uv run bandit -r src/ -ll -ii

      - name: Security scan - pip-audit
        run: scripts/pip-audit.sh

  test:
    # ADDED 2026-08-18. This repo has 244 tests and CI ran NONE of them --
    # `lint-and-security` was the only job. That gap is not theoretical: the
    # upstream merge in this same PR fused Q/K/V into a single `qkv_proj` and
    # shipped an `Attention.sanitize` to convert older checkpoints that nothing
    # ever called, so every published ViT checkpoint failed strict loading.
    # Lint, format, bandit and pip-audit were all green on that regression.
    # tests/test_models.py::test_download_vit caught it in under a second.
    #
    # Separate job, not a step on lint-and-security: a lint failure must not
    # hide a broken model, and vice versa.
    #
    # ⛔ macos-latest, NOT ubuntu-latest. MLX is Metal-only: the `mlx` wheel
    # installs happily on Linux and then dies at import with
    # `ImportError: libmlx.so: cannot open shared object file`, so the whole
    # suite errors at conftest before collecting anything (exit 4). Measured on
    # this very PR's first run. GitHub-hosted macos runners are arm64 and are
    # free for public repos; the org's self-hosted mac pool is NOT usable here
    # because its runner groups set allows_public_repositories=false (see the
    # header of this file), so a fork's jobs queue on those labels forever.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pytest
        # -p no:randomly keeps ordering stable; some model tests download
        # weights from the HF Hub and are order-sensitive on cache warmth.
        run: uv run pytest tests/ -q --no-header

      - name: Assert the suite is not vacuous
        # A suite that collects 0 tests exits 5, and an `|| true` anywhere
        # upstream would read as green. Pin the floor to what exists today so
        # a collection error cannot masquerade as a pass.
        run: |
          set -euo pipefail
          n=$(uv run pytest tests/ -q --collect-only 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "collected ${n} tests"
          if [ "${n:-0}" -lt 200 ]; then
            echo "::error::expected >=200 tests, collected ${n}. A shrinking suite is a silent loss of coverage."
            exit 1
          fi
